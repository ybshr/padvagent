<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POWR WhatsApp Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#efeae2; --bar:#075e54; --me:#d9fdd3; --bot:#fff; --ink:#111b21; --muted:#667781; --accent:#25d366; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Noto Sans Arabic",system-ui,sans-serif; background:#d1d7db; color:var(--ink); }
  .app { max-width:820px; height:100vh; margin:0 auto; display:flex; flex-direction:column; background:var(--bg); }
  header { background:var(--bar); color:#fff; padding:12px 16px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  header .title { font-weight:600; flex:1; min-width:180px; }
  header .title small { display:block; font-weight:400; opacity:.8; font-size:12px; direction:ltr; text-align:right; }
  header button { background:rgba(255,255,255,.15); color:#fff; border:0; border-radius:16px; padding:6px 12px; cursor:pointer; font:inherit; font-size:13px; }
  header button:hover { background:rgba(255,255,255,.28); }
  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:8px; }
  .msg { max-width:78%; padding:8px 12px; border-radius:8px; white-space:pre-wrap; line-height:1.7; box-shadow:0 1px .5px rgba(0,0,0,.13); unicode-bidi:plaintext; }
  .me { align-self:flex-start; background:var(--me); }      /* RTL: start = right */
  .bot { align-self:flex-end; background:var(--bot); }
  .meta { font-size:11px; color:var(--muted); margin-top:4px; display:flex; gap:6px; flex-wrap:wrap; direction:ltr; justify-content:flex-end; }
  .tag { padding:1px 8px; border-radius:10px; background:#e9edef; }
  .tag.quoted { background:#d8f5e4; color:#0a7a3b; } .tag.needs_human { background:#fde2e1; color:#b42318; }
  .tag.incomplete, .tag.unsupported { background:#fff4d6; color:#8a6100; }
  .tag a { color:inherit; }
  .sep { align-self:center; background:#e1f2fb; color:#3b5566; font-size:12px; padding:4px 12px; border-radius:8px; }
  form { display:flex; gap:8px; padding:10px; background:#f0f2f5; }
  textarea { flex:1; resize:none; border:0; border-radius:20px; padding:10px 14px; font:inherit; height:44px; unicode-bidi:plaintext; }
  form button { width:44px; height:44px; border-radius:50%; border:0; background:var(--accent); color:#fff; font-size:18px; cursor:pointer; }
  .typing { color:var(--muted); font-size:13px; align-self:flex-end; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title">POWR – مساعد الشراكات الإعلانية <small id="sender"></small></div>
    <button data-s="A">حالة A: طلب واضح</button>
    <button data-s="B">حالة B: طلب ناقص</button>
    <button data-s="C">حالة C: خصم أعلى من الحد</button>
    <button id="reset">محادثة جديدة</button>
  </header>
  <div id="log"></div>
  <form id="f">
    <textarea id="t" placeholder="اكتب رسالة… (Enter للإرسال)"></textarea>
    <button title="إرسال">➤</button>
  </form>
</div>
<script>
const SCENARIOS = {
  A: ["السلام عليكم، معكم شركة نخلة للتمور. نبغى إعلان ريل على انستقرام لمدة شهرين، وميزانيتنا 50 ألف ريال."],
  B: ["مرحبا، أنا من براند لمسة للعطور ونبي نسوي حملة إعلانية لمدة شهر", "تيك توك", "ميزانيتنا تقريباً 20 ألف ريال"],
  C: ["السلام عليكم، براند سرعة للقهوة. نبي فيديو مخصص على يوتيوب مع مشهور Tier A لمدة 30 يوم، ميزانيتنا 220 ألف ريال، بس نبي خصم 30%.", "طيب متى تردون علينا؟"],
};
const LABELS = { quoted:"Quoted", incomplete:"Asking", unsupported:"Unsupported", needs_human:"Handed to human" };
const log = document.getElementById("log"), t = document.getElementById("t");
let sender, queue = [];

function newChat(label) {
  sender = "+9665" + String(Math.floor(Math.random() * 1e8)).padStart(8, "0");
  document.getElementById("sender").textContent = sender;
  log.innerHTML = "";
  if (label) sep(label);
}
function sep(text) { const d = document.createElement("div"); d.className = "sep"; d.textContent = text; log.appendChild(d); }
function bubble(text, who, meta) {
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.textContent = text;
  if (meta) d.appendChild(meta);
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
}
function metaFor(r) {
  const m = document.createElement("div"); m.className = "meta";
  const s = document.createElement("span"); s.className = "tag " + r.status; s.textContent = LABELS[r.status] || r.status; m.appendChild(s);
  if (r.odoo_opportunity_id) {
    const o = document.createElement("span"); o.className = "tag";
    const a = document.createElement("a"); a.href = r.odoo_url; a.target = "_blank"; a.rel = "noopener";
    a.textContent = "Odoo #" + r.odoo_opportunity_id; o.appendChild(a); m.appendChild(o);
  }
  if (r.missing_fields && r.missing_fields.length) {
    const x = document.createElement("span"); x.className = "tag"; x.textContent = "missing: " + r.missing_fields.join(", "); m.appendChild(x);
  }
  return m;
}
async function send(text) {
  bubble(text, "me");
  const typing = document.createElement("div"); typing.className = "typing"; typing.textContent = "يكتب…"; log.appendChild(typing);
  try {
    const res = await fetch("/api/webhook", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sender, message: text, message_id: crypto.randomUUID() }) });
    const r = await res.json();
    typing.remove();
    if (!res.ok) throw new Error(r.detail || res.status);
    bubble(r.reply, "bot", metaFor(r));
  } catch (e) { typing.remove(); bubble("⚠️ " + e.message, "bot"); }
  t.value = queue.shift() || "";
  t.focus();
}
document.getElementById("f").onsubmit = e => { e.preventDefault(); const v = t.value.trim(); if (v) send(v); };
t.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); document.getElementById("f").requestSubmit(); } };
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
  newChat(b.textContent);
  queue = SCENARIOS[b.dataset.s].slice();
  t.value = queue.shift(); t.focus();
});
document.getElementById("reset").onclick = () => { queue = []; t.value = ""; newChat(); };
newChat();
</script>
</body>
</html>
